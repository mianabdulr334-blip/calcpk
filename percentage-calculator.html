<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Percentage Calculator - CalcPK</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 20px;
        }

        .nav {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #155eef;
            font-size: 28px;
            font-weight: bold;
        }

        .home {
            text-decoration: none;
            color: #374151;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #667085;
            margin-bottom: 30px;
        }

        .calculator {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .calculator h2 {
            font-size: 19px;
            margin-bottom: 15px;
        }

        .inputs {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #155eef;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #104bc4;
        }

        .result {
            margin-top: 15px;
            padding: 12px;
            background: #f0f6ff;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                margin: 30px auto;
            }

            .box {
                padding: 25px 18px;
            }

            h1 {
                font-size: 30px;
            }

            .inputs {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="nav">
        <div class="logo">CalcPK</div>
        <a href="index.html" class="home">← Home</a>
    </div>
</header>

<div class="container">

    <div class="box">

        <h1>Percentage Calculator</h1>

        <p class="description">
            Calculate percentages quickly and easily.
        </p>

        <div class="calculator">

            <h2>What is X% of Y?</h2>

            <div class="inputs">
                <input type="number" id="percent1" placeholder="Percentage (%)">
                <input type="number" id="number1" placeholder="Number">
            </div>

            <button onclick="calculatePercentage()">
                Calculate
            </button>

            <div class="result" id="result1"></div>

        </div>

        <div class="calculator">

            <h2>X is what percentage of Y?</h2>

            <div class="inputs">
                <input type="number" id="number2" placeholder="X">
                <input type="number" id="number3" placeholder="Y">
            </div>

            <button onclick="calculateWhatPercent()">
                Calculate
            </button>

            <div class="result" id="result2"></div>

        </div>

        <div class="calculator">

            <h2>Percentage Increase / Decrease</h2>

            <div class="inputs">
                <input type="number" id="oldValue" placeholder="Original value">
                <input type="number" id="newValue" placeholder="New value">
            </div>

            <button onclick="calculateChange()">
                Calculate
            </button>

            <div class="result" id="result3"></div>

        </div>

    </div>

</div>

<script>

function calculatePercentage() {

    let percent = Number(document.getElementById("percent1").value);
    let number = Number(document.getElementById("number1").value);

    if (!percent || !number) {
        alert("Please enter both values.");
        return;
    }

    let result = (percent / 100) * number;

    document.getElementById("result1").innerHTML =
        percent + "% of " + number + " = " + result;

    document.getElementById("result1").style.display = "block";
}


function calculateWhatPercent() {

    let x = Number(document.getElementById("number2").value);
    let y = Number(document.getElementById("number3").value);

    if (!x || !y) {
        alert("Please enter both values.");
        return;
    }

    let result = (x / y) * 100;

    document.getElementById("result2").innerHTML =
        x + " is " + result.toFixed(2) + "% of " + y;

    document.getElementById("result2").style.display = "block";
}


function calculateChange() {

    let oldValue = Number(document.getElementById("oldValue").value);
    let newValue = Number(document.getElementById("newValue").value);

    if (!oldValue || !newValue) {
        alert("Please enter both values.");
        return;
    }

    let change = ((newValue - oldValue) / oldValue) * 100;

    let text;

    if (change > 0) {
        text = "Increased by " + change.toFixed(2) + "%";
    } else if (change < 0) {
        text = "Decreased by " + Math.abs(change).toFixed(2) + "%";
    } else {
        text = "No change";
    }

    document.getElementById("result3").innerHTML = text;
    document.getElementById("result3").style.display = "block";
}

</script>

</body>
</html>
